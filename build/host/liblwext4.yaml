
- name: host-liblwext4-raspi2b_r1-arm-hosted
  source: liblwext4@1.0.0
  dependency:
    - host-binutils-raspi2b_r1-arm-hosted
    - host-gcc-final-raspi2b_r1-arm-hosted
    - host-newlib-static-raspi2b_r1-arm-hosted
    - host-pkg-config-raspi2b_r1-arm
  build:
    - 'cd {SOURCE_DIR} && make arm-raspi2b_r1-bolthur-eabi'
    - 'cd {SOURCE_DIR}/build_arm-raspi2b_r1-bolthur-eabi && make -j{CPU_COUNT}'
  install:
    - 'cd {SOURCE_DIR}/build_arm-raspi2b_r1-bolthur-eabi && make install'



- name: host-freefont-raspi2b_r1-arm-hosted
  source: freefont@20120503
  install:
    - 'install -d "{SYSROOT}/arm-raspi2b_r1-bolthur-eabi/usr/share/font/freefont"'
    - 'install -m644 "{SOURCE_DIR}/FreeMono.ttf" "{SYSROOT}/arm-raspi2b_r1-bolthur-eabi/usr/share/font/freefont/FreeMono.ttf"'
    - 'install -m644 "{SOURCE_DIR}/FreeMonoBold.ttf" "{SYSROOT}/arm-raspi2b_r1-bolthur-eabi/usr/share/font/freefont/FreeMonoBold.ttf"'
    - 'install -m644 "{SOURCE_DIR}/FreeMonoBoldOblique.ttf" "{SYSROOT}/arm-raspi2b_r1-bolthur-eabi/usr/share/font/freefont/FreeMonoBoldOblique.ttf"'
    - 'install -m644 "{SOURCE_DIR}/FreeMonoOblique.ttf" "{SYSROOT}/arm-raspi2b_r1-bolthur-eabi/usr/share/font/freefont/FreeMonoOblique.ttf"'
    - 'install -m644 "{SOURCE_DIR}/FreeSans.ttf" "{SYSROOT}/arm-raspi2b_r1-bolthur-eabi/usr/share/font/freefont/FreeSans.ttf"'
    - 'install -m644 "{SOURCE_DIR}/FreeSansBold.ttf" "{SYSROOT}/arm-raspi2b_r1-bolthur-eabi/usr/share/font/freefont/FreeSansBold.ttf"'
    - 'install -m644 "{SOURCE_DIR}/FreeSansBoldOblique.ttf" "{SYSROOT}/arm-raspi2b_r1-bolthur-eabi/usr/share/font/freefont/FreeSansBoldOblique.ttf"'
    - 'install -m644 "{SOURCE_DIR}/FreeSansOblique.ttf" "{SYSROOT}/arm-raspi2b_r1-bolthur-eabi/usr/share/font/freefont/FreeSansOblique.ttf"'
    - 'install -m644 "{SOURCE_DIR}/FreeSerif.ttf" "{SYSROOT}/arm-raspi2b_r1-bolthur-eabi/usr/share/font/freefont/FreeSerif.ttf"'
    - 'install -m644 "{SOURCE_DIR}/FreeSerifBold.ttf" "{SYSROOT}/arm-raspi2b_r1-bolthur-eabi/usr/share/font/freefont/FreeSerifBold.ttf"'
    - 'install -m644 "{SOURCE_DIR}/FreeSerifBoldItalic.ttf" "{SYSROOT}/arm-raspi2b_r1-bolthur-eabi/usr/share/font/freefont/FreeSerifBoldItalic.ttf"'
    - 'install -m644 "{SOURCE_DIR}/FreeSerifItalic.ttf" "{SYSROOT}/arm-raspi2b_r1-bolthur-eabi/usr/share/font/freefont/FreeSerifItalic.ttf"'


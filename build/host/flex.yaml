
- name: host-flex
  source: flex@2.6.4
  dependency:
    - host-autoconf
    - host-automake
    - host-m4
    - host-bison
  configure:
    - folder: '{SOURCE_DIR}'
      command: sh autogen.sh
  prepare:
    - '{SOURCE_DIR}/configure --prefix={PREFIX}'
  build:
    - 'make -j{CPU_COUNT}'
  install:
    - 'make install'

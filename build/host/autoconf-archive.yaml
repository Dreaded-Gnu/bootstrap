
- name: host-autoconf-archive
  source: autoconf-archive@2023.02.20
  dependency:
    - host-patch
    - host-m4
    - host-autoconf
    - host-automake
    - host-libtool
  prepare:
    - '{SOURCE_DIR}/configure --prefix={PREFIX}'
  build:
    - 'make all -j{CPU_COUNT}'
  install:
    - 'make install -j{CPU_COUNT}'

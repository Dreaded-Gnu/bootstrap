
- name: host-dash-rpi2-arm-hosted
  source: dash@0.5.11.4
  dependency:
    - host-binutils-rpi2-arm-hosted
    - host-gcc-final-rpi2-arm-hosted
    - host-newlib-shared-rpi2-arm-hosted
    - host-newlib-static-rpi2-arm-hosted
    - host-libpng-rpi2-arm-hosted
    - host-zlib-rpi2-arm-hosted
  configure:
    - folder: '{SOURCE_DIR}'
      command: 'autoreconf -ivf'
  prepare:
    - 'CFLAGS="-DJOBS=0" {SOURCE_DIR}/configure --host=arm-rpi2-bolthur-eabi --prefix={SYSROOT}/arm-rpi2-bolthur-eabi/usr'
  build:
    - 'make -j{CPU_COUNT}'
  install:
    - 'make install'

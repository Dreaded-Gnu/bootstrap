
- name: host-newlib-static-raspi2b_r1-arm-hosted
  source: newlib@4.1.0
  dependency:
    - host-patch
    - host-rsync
    - host-findutils
    - host-binutils-raspi2b_r1-arm-hosted
    - host-gcc-stage1-raspi2b_r1-arm-hosted
    - tmp-autoconf-newlib-2.68
    - tmp-automake-newlib-1.11.6
  path:
    - '{PREFIX}/bin'
    - '{PREFIX}/../build/tmp/newlib-build/bin'
  configure:
    - folder: '{SOURCE_DIR}'
      command: autoconf
    - folder: '{SOURCE_DIR}/newlib'
      command: autoconf
    - folder: '{SOURCE_DIR}/newlib'
      command: 'automake --cygnus Makefile'
    - folder: '{SOURCE_DIR}/newlib/libm'
      command: autoreconf
    - folder: '{SOURCE_DIR}/newlib/libm/machine/arm'
      command: autoreconf
    - folder: '{SOURCE_DIR}/newlib/libc'
      command: autoreconf
    - folder: '{SOURCE_DIR}/newlib/libc/machine/arm'
      command: autoreconf
    - folder: '{SOURCE_DIR}/newlib/libc/sys'
      command: autoreconf
    - folder: '{SOURCE_DIR}/newlib/libc/sys/bolthur'
      command: autoreconf
    - folder: '{SOURCE_DIR}/libgloss'
      command: autoconf
    - folder: '{SOURCE_DIR}/libgloss/arm'
      command: autoreconf
  prepare:
    - 'if [ ! -f "{PREFIX}/bin/arm-raspi2b_r1-bolthur-eabi-cc" ]; then ln {PREFIX}/bin/arm-raspi2b_r1-bolthur-eabi-gcc {PREFIX}/bin/arm-raspi2b_r1-bolthur-eabi-cc; fi'
    - '{SOURCE_DIR}/configure --prefix={SYSROOT}/arm-raspi2b_r1-bolthur-eabi/usr --target=arm-raspi2b_r1-bolthur-eabi --disable-newlib-supplied-syscalls --enable-newlib-io-long-long --enable-newlib-io-long-double --with-pkgversion="newlib {VERSION}; bolthur bootstrap" --enable-newlib-elix-level=4 --enable-newlib-register-fini --disable-shared --disable-multilib --enable-newlib-io-c99-formats --with-tooldir='
  build:
    - 'make all -j{CPU_COUNT}'
  install:
    - 'make install'

